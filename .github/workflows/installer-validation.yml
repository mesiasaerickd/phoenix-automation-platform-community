name: PAP online installer validation
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/configure-*.py'
      - 'scripts/check-online.py'
      - 'k8s/**'
      - 'releases/ghcr-digests-dev.txt'
      - '.github/workflows/installer-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: YAML
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check PAP online rendered manifest
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          python scripts/configure-installation.py pap-ci 10.42.0.0/24 "$dir"
          python scripts/configure-images.py online "$dir"
          python scripts/check-online.py "$dir"
