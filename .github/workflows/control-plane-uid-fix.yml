name: PAP Control Plane UID 1001
on:
  push:
    branches: [dev]
    paths:
      - 'images/control-plane-uid-fix/**'
      - '.github/workflows/control-plane-uid-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify access to private base image
        shell: bash
        run: |
          set -euo pipefail
          base="ghcr.io/mesiasaerickd/pap-ee-control@sha256:776a5f0549461bf0767ca7ad52146d99120e6db4ed42c95f8c411acfc30736e3"
          if ! docker pull "$base"; then
            echo "::error::GHCR rejected access to the Control Plane base image. Grant this repository Actions access under the pap-ee-control package settings, or set a GHCR_READ_TOKEN secret with read:packages and package access. Do not alter the pinned digest without verifying it."
            exit 1
          fi
      - name: Build UID-fixed Control Plane EE locally
        run: |
          set -euo pipefail
          docker build -f images/control-plane-uid-fix/Dockerfile -t pap-ee-control:uid1001-candidate .
          docker run --rm --entrypoint /bin/sh --user 1001:0 pap-ee-control:uid1001-candidate -c '
            set -eu
            getent passwd 1001
            test "$(id -u)" = 1001
            test "$(id -g)" = 0
            git config --system --get-all safe.directory | grep -Fx "/var/lib/awx/projects/*"
          '
      - name: Publish candidate (not activated on the cluster)
        if: success()
        run: |
          set -euo pipefail
          image="ghcr.io/mesiasaerickd/pap-ee-control:dev-uid1001-${GITHUB_SHA::12}"
          docker tag pap-ee-control:uid1001-candidate "$image"
          docker push "$image"
          echo "CANDIDATE_IMAGE=$image" >> "$GITHUB_STEP_SUMMARY"
