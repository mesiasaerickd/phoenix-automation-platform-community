name: PAP Task Git Safety Fix
on:
  push:
    branches: [dev]
    paths:
      - 'images/task-git-fix/**'
      - '.github/workflows/task-git-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and verify Task candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build -f images/task-git-fix/Dockerfile -t pap-web-task:git-safety-candidate .
          docker run --rm --entrypoint /bin/sh pap-web-task:git-safety-candidate -c '
            set -eu
            test "$(id -u)" = 1000
            git config --system --get-all safe.directory | grep -Fx "/var/lib/awx/projects/*"
          '
      - name: Publish test image (no deployment)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          img="ghcr.io/mesiasaerickd/pap-web-task:dev-git-safety-${GITHUB_SHA::12}"
          docker tag pap-web-task:git-safety-candidate "$img"
          docker push "$img"
          echo "TEST_IMAGE=$img" >> "$GITHUB_STEP_SUMMARY"
